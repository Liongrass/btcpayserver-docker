# Generated by the Lightning Terminal plugin

services:
  btcpayserver:
    volumes:
      - "lnd_lit_datadir:/lit:ro"
  lnd_bitcoin:
    environment:
      LND_EXTRA_ARGS: |
        rpcmiddleware.enable=true
  lnd_lit:
    image: "lightninglabs/lightning-terminal:v0.17.6"
    container_name: btcpayserver_litd
    restart: unless-stopped
    expose:
      - "8443"
    volumes:
      - "lnd_lit_datadir:/root/.lit"
      - "lnd_bitcoin_datadir:/data/lnd:ro"
    links:
      - lnd_bitcoin
    command:
      - "--disableui"
      - "--httpslisten=0.0.0.0:8443"
      - "--network=${NBITCOIN_NETWORK}"
      - "--lnd-mode=remote"
      - "--remote.lnd.rpcserver=lnd_bitcoin:10009"
      - "--remote.lnd.macaroonpath=/data/lnd/admin.macaroon"
      - "--remote.lnd.tlscertpath=/data/lnd/tls.cert"
      - "--autopilot.disable"

volumes:
  lnd_lit_datadir:

required:
  - "bitcoin-lnd"
