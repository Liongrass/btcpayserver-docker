# Generated by the Lightning Terminal plugin

required-routes:
  - "lightning-terminal"

services:
  btcpayserver:
    environment:
      BTCPAY_EXTERNALSERVICES: "Lightning Terminal:${BTCPAY_PROTOCOL:-https}://${BTCPAY_HOST}/lit/;"
    volumes:
      - "lnd_lit_datadir:/lit:ro"
  lnd_bitcoin:
    environment:
      LND_EXTRA_ARGS: |
        rpcmiddleware.enable=true
  lnd_lit:
    image: "lightninglabs/lightning-terminal:v0.17.6-path-prefix"
    container_name: btcpayserver_litd
    restart: unless-stopped
    expose:
      - "8443"
    secrets:
      - lit_password
    volumes:
      - "lnd_lit_datadir:/lit"
      - "lnd_bitcoin_datadir:/data/lnd:ro"
    links:
      - lnd_bitcoin
    command:
      - "--lit-dir=/lit/.lit"
      - "--loop.loopdir=/lit/.loop"
      - "--pool.basedir=/lit/.pool"
      - "--faraday.faradaydir=/lit/.faraday"
      - "--taproot-assets.tapddir=/lit/.tapd"
      - "--httpslisten=0.0.0.0:8443"
      - "--uipassword_file=/run/secrets/lit_password"
      - "--network=${NBITCOIN_NETWORK}"
      - "--lnd-mode=remote"
      - "--remote.lnd.rpcserver=lnd_bitcoin:10009"
      - "--remote.lnd.macaroonpath=/data/lnd/admin.macaroon"
      - "--remote.lnd.tlscertpath=/data/lnd/tls.cert"
      - "--autopilot.disable"

volumes:
  lnd_lit_datadir:

secrets:
  lit_password:
    file: ../secrets/lit_password

required:
  - "bitcoin-lnd"
